name: pages
# Builds the project site (scripts/build-site.mjs: the user guide and the documentation from this repository's Markdown, plus site/) and publishes
# it to GitHub Pages at agent-world.in. It needs Settings > Pages > Source set to "GitHub Actions", once.
on:
  push:
    branches: [main]
    paths: ['docs/**', '*.md', 'site/**', 'scripts/build-site.mjs', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      # No scripts: the site needs only `marked`, not Electron's download.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/build-site.mjs site-dist
      - uses: actions/upload-pages-artifact@v5
        with: { path: site-dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the job that publishes may write to Pages or ask for the identity token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
