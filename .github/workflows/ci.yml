name: ci
# A pull request is tested once, by its own run; main is tested again after each merge. A branch push alone, with a pull request open, would be a second run of the same commit.
# ready_for_review is here so marking a draft ready starts the end-to-end run the draft skipped.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
# The jobs only read the repository: the token is limited to that.
permissions:
  contents: read
# A newer run of the same branch or pull request replaces the one still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # No commit credits an AI tool. The same check as the commit-msg hook (scripts/check-commit-messages.mjs), so a commit made where the hook is not installed is still caught.
  # Its own job because it needs a cheap Linux runner and no install, and a bad message should fail in seconds, not after the Mac job.
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Check the new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/check-commit-messages.mjs "$RANGE"

  # Whether this run needs the Mac end-to-end work: only a pull request that is ready for review and changed something besides docs, the changelog and pictures.
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
      why: ${{ steps.decide.outputs.why }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"; echo "why=a push to main runs the typecheck and unit tests only" >> "$GITHUB_OUTPUT"
          elif [ "$DRAFT" = true ]; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"; echo "why=this pull request is a draft; mark it ready for review to run the end-to-end specs" >> "$GITHUB_OUTPUT"
          else
            # A diff that fails prints nothing, and nothing listed counts as code: the specs run.
            git diff --name-only "$BASE...$HEAD" > changed.txt || : > changed.txt
            # package.json from both sides, so a release pull request (a new version and the changelog) can be told from a change of scripts or dependencies. A missing file reads as empty, which counts as code.
            git show "$BASE:package.json" > package.before.json 2>/dev/null || : > package.before.json
            git show "$HEAD:package.json" > package.after.json 2>/dev/null || : > package.after.json
            node scripts/ci-changes.mjs package.before.json package.after.json < changed.txt | tee code.txt
            if grep -q 'code=true' code.txt; then
              echo "e2e=true" >> "$GITHUB_OUTPUT"; echo "why=code changed" >> "$GITHUB_OUTPUT"
            else
              echo "e2e=false" >> "$GITHUB_OUTPUT"; echo "why=only docs, the changelog, pictures or the version in package.json changed" >> "$GITHUB_OUTPUT"
            fi
          fi

  # Watches the end-to-end jobs and says on the pull request when no Mac has picked them up after 5 minutes, instead of leaving it to the 15 minutes after which GitHub abandons them.
  # It only reads the run and writes one comment (scripts/ci-runner-watch.mjs); it is not one of the jobs the required check waits for. On a pull request from a fork the token cannot comment, and the run's summary says it instead.
  runner-watch:
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/ci-runner-watch.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}

  # The fast checks, first: a typo fails here in about a minute, before four Macs are started. Electron's binary is not needed for them.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  # Which spec files each of the four shards runs, balanced by how long each file took (scripts/shard-plan.mjs). Playwright's own --shard counts tests: one run had shards of 6.5, 12.3, 4.6 and 7.3 minutes, and the run is as slow as its slowest.
  # The times are e2e/durations.json, overlaid with the reports of the latest run that has them (kept 7 days). With neither, or if the plan fails, a shard has no files and the e2e job runs Playwright's own split.
  shards:
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Reports of the latest run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list --workflow ci --event pull_request --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" -p 'e2e-report-*' -D reports 2>/dev/null; then break; fi
          done
      - id: plan
        run: node scripts/shard-plan.mjs --reports $(ls reports/*/*.json 2>/dev/null)

  # The end-to-end specs, split over four Macs. Each shard builds the app and runs a quarter of the specs; the aggregator below reports for all of them.
  # The runner is macos-14, not macos-latest (which is macos-15). GitHub's macOS 15 and 26 pools were so short of machines on 2026-10-20 that jobs waited 15 minutes
  # for one and were then abandoned, with no other job of ours running. Measured the same day, one job per image: macos-14 started in 5 to 58 seconds, macos-15-intel in 4,
  # ubuntu-latest in 2, while macos-15 and macos-26 never started. Four macos-14 shards of the whole suite started within a minute of each other and took 3.6 to 8.6 minutes
  # (334 specs passed, 2 failed, none flaky); the same suite on Linux under xvfb failed about 1 spec in 9 and took 14 to 17 minutes, so it stays on Macs.
  # An earlier count of this repository's jobs put the most that ran at once at 5. No concurrency group makes pull requests wait for each other: GitHub keeps one
  # pending run per group and cancels an older pending one, so a third pull request would cancel the second.
  e2e:
    needs: [changes, checks, shards]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    runs-on: macos-14
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/report-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      # Electron's download is the one that failed the first end-to-end test, two workers at once, and read as a broken test: it is cached, and fetched before any test starts.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm run build
      - name: Run this shard's specs
        env:
          FILES: ${{ matrix.files }}
        run: |
          if [ -n "$FILES" ]; then pnpm exec playwright test $FILES; else pnpm exec playwright test --shard=${{ matrix.shard }}/4; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: playwright-report/report-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # The one required check. Its name is what the repository's ruleset asks for, so it stays exactly this whatever runs behind it.
  # It passes when the end-to-end work was left out on purpose (a draft, only docs changed, a push to main) and fails unless every job before it succeeded or was skipped:
  # a job that never got a Mac is "abandoned", which is neither, and must not pass.
  test:
    name: test (macos-latest)
    needs: [changes, checks, shards, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        if: needs.e2e.result != 'skipped'
        with:
          pattern: e2e-report-*
          merge-multiple: true
          path: reports
      - name: Summary
        env:
          E2E: ${{ needs.changes.outputs.e2e }}
          WHY: ${{ needs.changes.outputs.why }}
        run: |
          if [ "$E2E" = true ]; then
            node scripts/ci-summary.mjs reports/*.json >> "$GITHUB_STEP_SUMMARY" || true
          else
            printf '## End-to-end\n\nSkipped: %s.\n' "$WHY" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Every job before this one passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: node scripts/ci-needs.mjs "$RESULTS"
