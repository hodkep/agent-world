name: release
# A tag like v0.1.0 builds the Mac installers and uploads them to the GitHub release of that tag.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    # The `release` environment holds the signing secrets, runs only for a `v*` tag, and waits for the owner to approve (Settings > Environments).
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      # The git the app carries for a Mac that has none, for both kinds of processor.
      - run: node scripts/fetch-git.mjs --platform
      - run: pnpm exec electron-vite build
      # With the Apple secrets set, the Mac build is signed with the Developer ID certificate and notarised; without them it is signed ad hoc (see electron-builder.yml),
      # which installs but cannot be updated by the app. The owner and repository are given here, so the update address baked into the app
      # is this repository whatever the git remote is called. The release is made as a draft: publish it on GitHub once the build has uploaded (see RELEASING.md).
      - name: Build and upload the installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args="--publish always --config.publish.owner=${{ github.repository_owner }} --config.publish.repo=${{ github.event.repository.name }}"
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$CSC_LINK" ]; then
            # awSigned is written into package.json inside the app: an app signed with a Developer ID can install its own updates, one signed ad hoc can only be told of them.
            args="$args --config.mac.identity=null --config.mac.notarize=true --config.extraMetadata.awSigned=true"
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          pnpm exec electron-builder $args
