# A second, separate install for testing: "Agent World 2" has its own name, its own app id and its own data folder
# (~/.agent-world-2), so it never reads or changes what the regular Agent World keeps, and it opens on first-run setup.
extends: electron-builder.yml
appId: dev.agentworld.app2
productName: Agent World 2
# The packaged package.json names the app: a different name gives it its own user-data folder and its own single-instance lock,
# so it opens even while the regular Agent World is running.
extraMetadata:
  name: agent-world-2
  productName: Agent World 2
  awHome: .agent-world-2
dmg:
  title: "Agent World 2"
  background: build/background.png
  window: { width: 540, height: 380 }
  iconSize: 112
  contents:
    - { x: 140, y: 200 }
    - { x: 400, y: 200, type: link, path: /Applications }
artifactName: "${productName}-${version}-${arch}.${ext}"
