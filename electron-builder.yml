appId: dev.agentworld.app
productName: Agent World
directories:
  output: dist
files:
  - out/**
  - package.json
# node-pty ships a native module and its spawn helper; both must live outside the asar archive to be executed.
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: true
icon: build/icon.png
mac:
  category: public.app-category.developer-tools
  target:
    - { target: dmg, arch: [arm64, x64] }
  # Signed with an ad-hoc identity so it runs on other Macs after right-click > Open. A Developer ID
  # certificate (CSC_LINK / CSC_KEY_PASSWORD, APPLE_* for notarisation) replaces this when there is one.
  identity: "-"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  title: "Agent World"
artifactName: "${productName}-${version}-${arch}.${ext}"
win:
  target: [nsis]
linux:
  target: [AppImage, deb]
  category: Development
  maintainer: Pratik <agentworld.app@gmail.com>
# Installers are published to the project's GitHub releases by the release workflow; the installed app looks there for updates unless Settings gives another address.
# The owner and repository come from the repository field of package.json or the git remote the build runs in.
publish:
  - provider: github
