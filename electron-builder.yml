appId: dev.agentworld.app
productName: Agent World
directories:
  output: dist
files:
  - out/**
  - package.json
# node-pty ships a native module and its spawn helper; both must live outside the asar archive to be executed.
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: true
# The Preview keeps its logins for thirty days: with this fuse Electron stores the cookies' values encrypted (the key is in the Keychain, under "Agent World Safe Storage"), not as plain text.
electronFuses:
  enableCookieEncryption: true
# Apache 2.0 section 4: the license and the NOTICE file travel with the app, next to its resources; so does the changelog, which the installed version's What's new is read from.
extraResources:
  - LICENSE
  - NOTICE
  - CHANGELOG.md
  # The guide agents read in the library: the same pages as docs/guide on GitHub.
  - { from: docs/guide, to: guide }
icon: build/icon.png
mac:
  category: public.app-category.developer-tools
  target:
    - { target: dmg, arch: [arm64, x64] }
    # electron-updater on macOS installs the zip that latest-mac.yml points at; the dmg is what people download.
    - { target: zip, arch: [arm64, x64] }
  # Signed with an ad-hoc identity so it runs on other Macs after right-click > Open. A Developer ID
  # certificate (CSC_LINK / CSC_KEY_PASSWORD, APPLE_* for notarisation) replaces this when there is one.
  identity: "-"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The git the app uses when the computer has none (a fresh Mac has none until Apple's tools are installed): the one for the processor being built, from scripts/fetch-git.mjs.
  extraResources:
    - { from: "build/git/darwin-${arch}", to: git }
# The Linux beta: an AppImage (runs anywhere, nothing to install) and a deb (Debian and Ubuntu; its post-install step sets up Chromium's sandbox, which an AppImage cannot).
# Built on Linux only (node-pty is native): .github/workflows/release-linux.yml. The app does not replace itself here; it says a newer build exists (see updateMode).
linux:
  category: Development
  executableName: agent-world
  # What the deb's package list shows; the one in package.json is the Mac app's.
  description: Run and steer Claude Code and Antigravity agents from a pixel-art office (Linux beta).
  # Lets the desktop link a running window to its menu entry and icon.
  syncDesktopName: true
  target:
    - { target: AppImage, arch: [x64] }
    - { target: deb, arch: [x64] }
  # A computer with no git still works: the same bundled git as on the Mac, for the processor being built.
  extraResources:
    - { from: "build/git/linux-${arch}", to: git }
dmg:
  title: "Agent World"
artifactName: "Agent-World-${version}-${arch}.${ext}"
# Installers are published to the project's GitHub releases by the release workflow; the installed app looks there for updates.
# The owner and repository come from the repository field of package.json or the git remote the build runs in.
publish:
  - provider: github
