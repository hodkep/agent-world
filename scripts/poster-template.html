<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Agent World {{version}}</title>
<style>
/* The look since 0.11.0: a tall brass version on the left, the changes as stacked rows on the right, each with a pixel drawing picked by its kicker (Library, Workflows, Agents, Chat, Office, Preview; anything else gets the gear). Drawn at 1280x720 and zoomed 2x. */
:root{--bg:#12101a;--panel:#1a1726;--line:#2c3350;--text:#e4e4ee;--muted:#a4a2b8;--accent:#f2c230;--think:#6ad0e0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,system-ui,sans-serif}
#poster{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--bg);zoom:2;font-family:Futura,-apple-system,system-ui,sans-serif}
svg{shape-rendering:crispEdges}
.left{position:absolute;left:56px;top:40px;width:440px;height:640px}
.brand{font:500 14px/1 Futura,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.ver{margin-top:14px;font:700 150px/.95 Futura,sans-serif;letter-spacing:-.05em;color:var(--accent);white-space:nowrap}
.pre{margin-top:10px;font:700 26px/1 Futura,sans-serif;letter-spacing:.04em;color:var(--accent)}
.tag{margin-top:26px}.tag b{display:block;font:700 30px/1.1 Futura,sans-serif}.tag span{display:block;margin-top:8px;font:400 14.5px/1.45 -apple-system,system-ui,sans-serif;color:var(--muted)}
.foot{position:absolute;left:0;bottom:0;font:500 12px/1 Futura,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pcards{position:absolute;left:560px;right:56px;top:48px;bottom:100px;display:flex;flex-direction:column;justify-content:center}
.pcard{display:grid;grid-template-columns:150px 1fr;gap:26px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}.pcard:first-child{border-top:0;padding-top:0}
.pcard svg{width:150px;height:110px;display:block;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line)}
.pcard .psub{display:none}.pcard h3{margin:0 0 4px;font:700 22px/1.1 Futura,sans-serif}.pcard p{margin:0;font:400 13.5px/1.45 -apple-system,system-ui,sans-serif;color:var(--muted)}
.pbig{margin-top:6px;font:700 28px/1 Futura,sans-serif;color:var(--accent)}.pbiglabel{font:500 11px/1 Futura,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pchip{font:500 11px/1 -apple-system,system-ui,sans-serif;padding:4px 8px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);color:var(--think)}
.palso{position:absolute;left:560px;right:56px;bottom:30px;font:400 12.5px/1.6 -apple-system,system-ui,sans-serif;color:var(--muted)}
.palso .psub{display:inline;color:var(--think);font-weight:600}.palso .psub::after{content:" · "}.palso .pchips{display:inline;margin:0}.palso .pchip{display:inline;padding:0;background:none;box-shadow:none;color:var(--muted)}.palso .pchip::after{content:" · "}.palso .pchip:last-child::after{content:""}
</style></head><body>

</defs></svg>
<div id="poster">
 <div class="left"><div class="brand">Agent World</div><div class="ver">{{version}}</div><div class="tag"><b>{{tagline}}</b><span>{{subtitle}}</span></div><div class="foot">{{footer}}</div></div>
 {{cards}}
 {{also}}
</div>
<script>
// A pre-release tag (-beta.1) goes under the number, small; a long core version is set smaller so it stays on one line.
const ver = document.querySelector('.ver'), [core, ...rest] = ver.textContent.split('-')
ver.textContent = core
// A digit is about .56em wide and a dot .3em in Futura bold: the number is set as large as its 440px column allows, up to 150px.
const units = [...core].reduce((n, c) => n + (c === '.' ? 0.3 : 0.56), 0)
ver.style.fontSize = Math.min(150, Math.floor(440 / units)) + 'px'
if (rest.length) { const pre = document.createElement('div'); pre.className = 'pre'; pre.textContent = '-' + rest.join('-'); ver.after(pre) }
// Each card's kicker names its drawing: one per area of the app, the gear for anything else. The kicker itself is not shown.
const known = ['library', 'workflows', 'agents', 'chat', 'office', 'preview']
for (const card of document.querySelectorAll('.pcard')) {
  const k = (card.querySelector('.psub')?.textContent || '').trim().toLowerCase()
  const id = known.find((n) => k.includes(n)) || 'other'
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('viewBox', '0 0 240 150')
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use')
  use.setAttribute('href', '#d-' + id)
  svg.appendChild(use)
  const body = document.createElement('div')
  while (card.firstChild) body.appendChild(card.firstChild)
  card.append(svg, body)
}
// Rows that would run past the frame (long titles, four chips, a big figure on every card) are scaled down together until they fit.
const col = document.querySelector('.pcards')
if (col) {
  const inner = document.createElement('div')
  while (col.firstChild) inner.appendChild(col.firstChild)
  col.appendChild(inner)
  if (inner.scrollHeight > col.clientHeight) inner.style.zoom = String(Math.max(0.6, col.clientHeight / inner.scrollHeight))
}
</script></body></html>
